name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: PRODUCTION
      SSL: "FALSE"
      PORT: "9000"
      DB_USER: app_user
      DB_PASS: app_user_dev_password
      DB_ADMIN_USER: app_admin
      DB_ADMIN_PASS: app_admin_dev_password
      DB_NAME: golang_gin_db
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_HOST: 127.0.0.1:6379
      REDIS_PASSWORD: ""
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Configure disposable test services
        run: |
          touch .env
          echo "ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE golang_gin_db'
          # The migrations create the cluster roles themselves (idempotent DO
          # blocks) and must run as a superuser; the tests then connect as
          # app_user/app_admin so the row level security is actually exercised.
          make migrate_up DB_USER=postgres DB_PASS=postgres
          # The Go suites run on the disposable artisan_test database
          # (pinned by each package's TestMain); the smoke binary keeps
          # golang_gin_db.
          E2E_DB_ADMIN_USER=postgres E2E_DB_ADMIN_PASS=postgres E2E_DB_NAME=artisan_test REDIS_DB=2 go run -mod=readonly ./cmd/e2edb
          make migrate_up DB_NAME=artisan_test DB_USER=postgres DB_PASS=postgres
      - name: Build and vet
        run: |
          go mod verify
          go build -mod=readonly -o /tmp/gin-boilerplate ./cmd/api
          go vet -mod=readonly ./...
      - name: Verify generated sqlc code
        run: |
          make generate_sqlc
          git diff --exit-code internal/platform/db
      - name: Check removed legacy drivers
        run: |
          # Comment prose may mention the retired drivers; only quoted import
          # paths are regressions.
          ! grep -rEn '"(github\.com/)?(jmoiron/sqlx|lib/pq)"' --include='*.go' .
      - name: Check no hardcoded Redis index
        run: |
          ! git grep -n "InitRedis(1)" -- '*.go'
      - name: Check test helper isolation
        run: |
          # internal/testutil carries test-only dependencies (gofakeit,
          # testfixtures, testcontainers): importing it outside *_test.go
          # files would leak them into the production binary.
          if git grep -l "internal/testutil" -- '*.go' ':(exclude)*_test.go'; then
            exit 1
          fi
      - name: Install PDF content test dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Test
        run: go test -mod=readonly -count=1 -p 1 -race -v -tags=all ./...
      - name: Smoke test production routes
        run: |
          smoke_dir=$(mktemp -d)
          export SMOKE_DIR="$smoke_dir"
          /tmp/gin-boilerplate > /tmp/gin-boilerplate.log 2>&1 &
          server_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              tail -n 200 /tmp/gin-boilerplate.log
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$smoke_dir"
            exit "$result"
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..50}; do
            kill -0 "$server_pid"
            if curl --fail --silent --connect-timeout 2 --max-time 2 http://127.0.0.1:9000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            exit 1
          fi
          for encoding in identity gzip; do
            # The swagger UI is a non-production surface (mounted only when
            # ENV != PRODUCTION): the production smoke probes the demo shell
            # and the API guard only.
            for path in / /v1/articles; do
              status=$(curl --compressed --silent --show-error --connect-timeout 2 --max-time 10 \
                -H "Accept-Encoding: $encoding" -D "$smoke_dir/headers" -o "$smoke_dir/body" \
                --write-out '%{http_code}' "http://127.0.0.1:9000$path")
              python3 - "$path" "$status" "$encoding" <<'PY'
          import os
          from pathlib import Path
          import sys

          route, status, encoding = sys.argv[1:]
          output = Path(os.environ["SMOKE_DIR"])
          body = (output / "body").read_bytes()
          headers = (output / "headers").read_text().lower()
          expected = "401" if route == "/v1/articles" else "200"
          assert status == expected, (route, status, expected)
          fragments = {
              "/": b"Gin Boilerplate",
              "/v1/articles": b"Please login first",
          }
          if route in fragments:
              assert fragments[route] in body, (route, "unexpected body")
          if encoding == "gzip" and route == "/":
              assert "content-encoding: gzip" in headers, "gzip response missing"
          if encoding == "identity":
              assert "content-encoding: gzip" not in headers, "unexpected gzip response"
          print(f"PASS {route}: status={status}, encoding={encoding}")
          PY
            done
          done
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (tag v6 peeled)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Build Storybook (smoke)
        run: pnpm build-storybook
