name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: PRODUCTION
      SSL: "FALSE"
      PORT: "9000"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: golang_gin_db
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_HOST: 127.0.0.1:6379
      REDIS_PASSWORD: ""
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Configure disposable test services
        run: |
          touch .env
          echo "ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE golang_gin_db'
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/database.sql
      - name: Build and vet
        run: |
          go mod verify
          go build -mod=readonly -o /tmp/gin-boilerplate .
          go vet -mod=readonly ./...
      - name: Test
        run: go test -mod=readonly -count=1 -race -v -tags=all ./...
      - name: Smoke test production routes
        run: |
          /tmp/gin-boilerplate > /tmp/gin-boilerplate.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:9000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            cat /tmp/gin-boilerplate.log
            exit 1
          fi
          for path in / /v1/invoice /v1/invoice/download /swagger/index.html /swagger/doc.json /swagger/swagger-initializer.js /swagger/swagger-ui.css /swagger/swagger-ui-bundle.js; do
            curl --compressed --fail --silent --show-error "http://127.0.0.1:9000$path" > /dev/null
          done
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
